name: Validar favicon e interface do Gestão Operacional

on:
  push:
    branches: [main]
    paths:
      - "streamlit_app.py"
      - "streamlit_app_original.py"
      - "setta_visual.py"
      - "ui_refinements.py"
      - "indicadores_dashboard.py"
      - "scripts/test_ui_favicon_and_layout.py"
      - ".github/workflows/verify-gestao-visual.yml"
  pull_request:
    paths:
      - "streamlit_app.py"
      - "streamlit_app_original.py"
      - "setta_visual.py"
      - "ui_refinements.py"
      - "indicadores_dashboard.py"
      - "scripts/test_ui_favicon_and_layout.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificacao-estatica:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar módulos alterados
        run: python -m py_compile streamlit_app.py streamlit_app_original.py setta_visual.py ui_refinements.py indicadores_dashboard.py
      - name: Executar testes de regressão da interface
        run: python scripts/test_ui_favicon_and_layout.py
